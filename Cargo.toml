[package]
name = "weld_runtime"
version = "0.1.0"
edition = "2024"

[dependencies]
wasmtime = { version = "51.0.0", features = ["threads"] }
anyhow = "1.0.104"
wgpu = "30.0.2"
winit = "0.30.13"
pollster = "0.4.0"
serde_json = "1.0"
reqwest = { version = "0.13", features = ["blocking", "json", "cookies", "gzip", "deflate"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }
tokio-rustls = "0.26"
rustls = "0.23"
rustls-platform-verifier = "0.7"
wtransport = { version = "0.7.2", default-features = false, features = ["quinn", "aws-lc-rs"] }
base64 = "0.22"
cpal = "0.18"
